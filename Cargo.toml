[package]
name = "mmr"
version = "0.0.0" # a release takes its version from its tag
edition = "2021"
description = "Shows the hidden matchmaking rating of every player in your Halo Infinite lobby"
license = "MIT"
repository = "https://github.com/OpenSpartan/mmr"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "x509-parser"] }
rustls-native-certs = "0.8.5"
time = "0.3.55"
ring = "0.17.14"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Networking_WinInet", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_Threading"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn" # each unsafe op gets its own block, as edition 2024 asks
unused_qualifications = "warn"  # a path the prelude or a use already covers

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The pedantic lints that fight the house style, or don't fit a 64-bit Windows binary.
cast_possible_truncation = "allow" # 64-bit only: lengths fit usize, and terminal cells fit u16
cast_precision_loss = "allow"      # averages of small counts
many_single_char_names = "allow"   # short names are house style
similar_names = "allow"            # follows from short names, like lit and list
struct_field_names = "allow"       # match_id is the API's own name
doc_markdown = "allow"             # comments are prose, not markup
unreadable_literal = "allow"       # XUIDs and GUID parts are written as the game writes them
decimal_bitwise_operands = "allow" # Bond field headers pack an id and a type in decimal
single_match_else = "allow"        # a two-arm match reads as well as if let
match_same_arms = "allow"          # decision tables keep each case on its own row
struct_excessive_bools = "allow"   # CLI flags and UI toggles are plain bools
# Beyond pedantic.
allow_attributes = "warn"                # #[expect] says when its lint stops firing
allow_attributes_without_reason = "warn" # each exception says why
dbg_macro = "warn"                       # stray output tears the full-screen view
todo = "warn"                            # no unfinished paths in a release
undocumented_unsafe_blocks = "warn"      # each unsafe block says why it's sound
redundant_clone = "warn"
